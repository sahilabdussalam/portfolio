<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammed Sahil K S — Writer &amp; Future Educator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111113;
    --paper:#FFFFFF;
    --backdrop:#E7E6E2;
    --gray-1:#6E6E72;
    --gray-2:#9A9A9E;
    --line:#E4E3DF;
    --green:#3FBF6B;
    --display: 'Archivo', sans-serif;
    --sans: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --radius-lg: 32px;
    --radius-md: 18px;
    --radius-pill: 999px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--backdrop);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:24px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--ink); color:var(--paper);}
  :focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  .frame{
    max-width:1180px; margin:0 auto;
    background:var(--paper);
    border-radius:var(--radius-lg);
    padding:28px 40px 0;
    box-shadow:0 1px 2px rgba(17,17,19,0.04);
  }
  .wrap{ max-width:1100px; margin:0 auto; }

  /* ---------- NAV ---------- */
  nav.topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 0 28px; flex-wrap:wrap; gap:16px;
  }
  .badge{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:var(--radius-pill);
    padding:8px 16px 8px 12px; font-size:0.85rem; font-weight:500;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0; }
  .nav-links{ display:flex; align-items:center; gap:32px; }
  .nav-links a{
    font-size:0.92rem; font-weight:500; color:var(--ink); display:flex; align-items:baseline; gap:4px;
    border-bottom:1px solid transparent; padding-bottom:2px; transition:border-color 0.2s ease, font-weight 0.15s ease;
    text-decoration:none;
  }
  .nav-links a:hover, .nav-links a:focus-visible{ border-color:var(--ink); }
  .nav-links a.active{ border-color:var(--ink); font-weight:700; }
  .nav-links a .count{ font-family:var(--mono); font-size:0.72rem; color:var(--gray-2); }
  .nav-cta{
    background:var(--ink); color:var(--paper); border-radius:var(--radius-pill);
    padding:12px 22px; font-size:0.9rem; font-weight:600; display:inline-flex; align-items:center; gap:6px;
    transition:transform 0.18s ease;
  }
  .nav-cta:hover, .nav-cta:focus-visible{ transform:translateY(-2px); }
  .nav-toggle{ display:none; }

  /* ---------- HERO ---------- */
  .hero{ position:relative; padding-bottom:0; }
  .hero-name{
    font-family:var(--display); font-weight:800; text-transform:uppercase;
    font-size:clamp(3.2rem, 9vw, 7.4rem); line-height:0.92; letter-spacing:-0.01em;
    display:flex; flex-wrap:wrap; gap:0 22px;
  }
  .hero-name .outline{
    -webkit-text-stroke: 2px var(--ink); color:transparent;
  }
  .hero-name .solid{ color:var(--ink); }
  .hero-name .quality-mark{
    font-family:var(--mono); font-weight:700; text-transform:uppercase;
    font-size:0.82rem; letter-spacing:0.05em; color:var(--ink);
    align-self:flex-start; margin-top:6px;
    border:1.5px solid var(--ink); border-radius:var(--radius-pill);
    padding:8px 16px; display:inline-flex; align-items:center; gap:8px;
  }
  .hero-name .quality-mark .qdot{ width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; }

  .hero-quote{
    font-family:var(--display); font-style:italic; font-weight:500;
    font-size:clamp(1.05rem, 2.4vw, 1.4rem); color:var(--gray-1);
    margin-top:16px; max-width:520px; letter-spacing:-0.01em;
  }
  .hero-quote::before{ content:"“"; }
  .hero-quote::after{ content:"”"; }
  .hero-body{
    display:grid; grid-template-columns:1fr 260px; gap:40px; align-items:end;
    margin-top:20px; position:relative;
  }
  .hero-left{ max-width:400px; padding-bottom:56px; }
  .role-tag{ font-family:var(--display); font-weight:700; font-size:1.4rem; margin-bottom:10px; }
  .role-desc{ color:var(--gray-1); font-size:0.98rem; margin-bottom:24px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.9rem; font-weight:600; border-radius:var(--radius-pill);
    padding:13px 22px; transition:transform 0.18s ease, background 0.18s ease;
  }
  .btn-dark{ background:var(--ink); color:var(--paper); }
  .btn-dark:hover, .btn-dark:focus-visible{ transform:translateY(-2px); }
  .btn-outline{ border:1px solid var(--ink); color:var(--ink); }
  .btn-outline:hover, .btn-outline:focus-visible{ background:var(--ink); color:var(--paper); }

  .portrait-col{ position:relative; display:flex; flex-direction:column; align-items:center; }
  .portrait{
    width:100%; aspect-ratio:3/3.6;
    background:linear-gradient(180deg,#D8D7D2 0%, #C7C6C0 100%);
    border-radius:var(--radius-md) var(--radius-md) 0 0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .portrait svg{ width:46%; opacity:0.55; }
  .portrait-label{
    position:absolute; bottom:14px; left:0; right:0; text-align:center;
    font-family:var(--mono); font-size:0.68rem; color:var(--gray-1); letter-spacing:0.03em;
  }

  .social-rail{
    position:absolute; right:-18px; top:0; display:flex; flex-direction:column; gap:10px;
  }
  .social-pill{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:var(--radius-pill);
    background:var(--paper); padding:9px 16px 9px 12px; font-size:0.82rem; font-weight:500;
    transition:border-color 0.18s ease, transform 0.18s ease;
  }
  .social-pill:hover, .social-pill:focus-visible{ border-color:var(--ink); transform:translateX(-3px); }
  .social-pill svg{ width:15px; height:15px; flex-shrink:0; }

  .hero-strip{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    border-top:1px solid var(--line); padding:22px 0; margin-top:12px; font-size:0.85rem; color:var(--gray-1);
  }
  .hero-strip .k{ font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--gray-2); margin-right:8px; }

  /* ---------- SECTION SHARED ---------- */
  section{ padding:70px 0; border-top:1px solid var(--line); }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:40px; flex-wrap:wrap; }
  .section-head h2{ font-family:var(--display); font-weight:800; font-size:clamp(1.8rem, 3.6vw, 2.6rem); text-transform:uppercase; letter-spacing:-0.01em; }
  .section-head .tag{
    font-family:var(--mono); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em;
    border:1px solid var(--ink); border-radius:var(--radius-pill); padding:5px 14px;
  }
  .section-intro{ max-width:560px; color:var(--gray-1); margin-bottom:36px; }

  /* ---------- ABOUT ---------- */
  .about-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:60px; }
  .about-grid p{ margin-bottom:16px; color:#33333a; }
  .about-grid p.lede{ font-family:var(--display); font-weight:700; font-size:1.5rem; text-transform:none; letter-spacing:0; margin-bottom:20px; }
  .stat-list{ border-top:1px solid var(--line); }
  .stat-row{ display:flex; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line); gap:16px; }
  .stat-row .k{ color:var(--gray-1); font-size:0.92rem; }
  .stat-row .v{ font-family:var(--mono); font-size:0.8rem; text-align:right; }

  /* ---------- JOURNEY ---------- */
  .journey-list{ border-top:1px solid var(--line); }
  .journey-row{
    display:grid; grid-template-columns:60px 1fr 140px; align-items:center; gap:16px;
    padding:22px 0; border-bottom:1px solid var(--line);
  }
  .journey-row .step{ font-family:var(--mono); font-size:0.85rem; color:var(--gray-2); }
  .journey-row h3{ font-family:var(--display); font-weight:700; font-size:1.1rem; text-transform:none; }
  .journey-row .status{
    font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em;
    border-radius:var(--radius-pill); padding:6px 12px; text-align:center; border:1px solid var(--line);
  }
  .journey-row .status.done{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .journey-row .status.active{ border-color:var(--green); color:#1c6b3d; }

  /* ---------- SERVICES ---------- */
  .service-list{ border-top:1px solid var(--ink); }
  .service-row{
    display:grid; grid-template-columns:90px 1fr 150px; gap:16px; align-items:center;
    padding:24px 0; border-bottom:1px solid
